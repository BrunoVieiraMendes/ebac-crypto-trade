<html>
    <head>
        <title>Recuperacao de senha!</title>
    </head>
    <body>
        <table border="0" cellspacing="0" cellpadding="0" align="center" width="600" style="width: 600; text-align: center">
            <tr>
                <td align="center">
                    <h1>Olá <%= nome %></h1>
                    <p>Recebemos um pedido de recuperacao de senha seu!</p>

                    <a href="<%= linkDeRecuperacao %>" target="_blank">Clique aqui para redefinir a sua senha</a>
                    <br />
                    <br />

                    <small>Caso nao tenha sido voce que tenha pedido esse email, basta ignorá-lo</small>

                    <p>Se o botão não abrir, copie e cole este endereço no navegador:</p>
                    <p style="word-break: break-all;"><%= linkDeRecuperacao %></p>
                </td>
            </tr>
        </table>
    </body>
</html>
